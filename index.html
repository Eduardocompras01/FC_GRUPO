<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financeiro — Grupo Engeluz</title>
<style>
  :root{
    --ink: #10192E;
    --line: #E3E6EC;
    --bg: #F6F7F9;
    --focus: #2453C6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--ink);
    font-family:'Inter',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }
  .shell-header{
    background:var(--ink);color:#fff;
    padding:14px clamp(16px,4vw,40px) 0;
    flex:0 0 auto;
  }
  .shell-eyebrow{
    font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;
    color:#9BB0DA;margin:0 0 10px;
  }
  .shell-tabs{display:flex;gap:4px;}
  .shell-tab{
    font-size:14.5px;font-weight:600;color:#9BAAC9;
    padding:11px 20px;cursor:pointer;border-radius:8px 8px 0 0;
    border:1px solid transparent;border-bottom:none;
    margin-bottom:-1px;
    transition:color .15s,background .15s,border-color .15s;
    user-select:none;
  }
  .shell-tab:hover{color:#fff;background:rgba(255,255,255,.08);}
  .shell-tab.active{
    color:var(--ink);
    background:var(--bg);
    border-color:var(--line);
    box-shadow:0 -2px 10px rgba(0,0,0,.12);
  }
  .shell-body{flex:1 1 auto;position:relative;background:var(--bg);}
  .shell-frame-wrap{
    position:absolute;inset:0;display:none;
  }
  .shell-frame-wrap.active{display:block;}
  iframe{width:100%;height:100%;border:0;display:block;background:var(--bg);}
</style>
</head>
<body>

<div class="shell-header">
  <p class="shell-eyebrow">Financeiro · Grupo Engeluz</p>
  <div class="shell-tabs">
    <div class="shell-tab active" data-target="pagar">Contas a Pagar</div>
    <div class="shell-tab" data-target="receber">Contas a Receber</div>
    <div class="shell-tab" data-target="caixa">Fluxo de Caixa</div>
    <div class="shell-tab" data-target="realizado">Realizado</div>
  </div>
</div>

<div class="shell-body">
  <div class="shell-frame-wrap active" id="wrap-pagar">
    <iframe id="frame-pagar" src="contas_a_pagar.html" title="Contas a Pagar"></iframe>
  </div>
  <div class="shell-frame-wrap" id="wrap-receber">
    <iframe id="frame-receber" data-src="contas_a_receber.html" src="" title="Contas a Receber"></iframe>
  </div>
  <div class="shell-frame-wrap" id="wrap-caixa">
    <iframe id="frame-caixa" data-src="fluxo_de_caixa.html" src="" title="Fluxo de Caixa"></iframe>
  </div>
  <div class="shell-frame-wrap" id="wrap-realizado">
    <iframe id="frame-realizado" data-src="realizado.html" src="" title="Realizado"></iframe>
  </div>
</div>

<script>
// Cada aba é um arquivo HTML independente e completo, carregado num iframe —
// os dados e a lógica de cada relatório não são tocados por este shell.
// "Fluxo de Caixa" é um relatório próprio (fluxo_de_caixa.html), que cruza
// o Contas a Pagar com o Contas a Receber por empresa/SPE. "Realizado"
// cruza o extrato bancário (Pago) com o Contas a Receber (Recebido).
const FRAMES_LOADED = {pagar: true, receber: false, caixa: false, realizado: false};

document.querySelectorAll('.shell-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const target = tab.dataset.target;

    document.querySelectorAll('.shell-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.shell-frame-wrap').forEach(w => w.classList.remove('active'));
    document.getElementById('wrap-' + target).classList.add('active');

    // Carrega o iframe só na primeira vez que a aba é aberta (mais rápido
    // no load inicial, já que cada relatório é um arquivo grande).
    if (!FRAMES_LOADED[target]){
      const frame = document.getElementById('frame-' + target);
      frame.src = frame.dataset.src;
      FRAMES_LOADED[target] = true;
    }
  });
});
</script>

</body>
</html>
